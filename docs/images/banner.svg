<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="bt bd">
  <title id="bt">Chiguru · Smart Krishi</title>
  <desc id="bd">Animated banner: a tractor drives across a green farm while a farmer asks the Chiguru voice kiosk a question in English, Kannada and Hindi.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ee"/>
      <stop offset="0.6" stop-color="#dcf0f2"/>
      <stop offset="1" stop-color="#fff1d4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dba5c"/>
      <stop offset="1" stop-color="#4c8a37"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="58" ry="20" fill="#ffffff"/>
      <circle cx="-22" cy="-12" r="22" fill="#ffffff"/>
      <circle cx="12" cy="-20" r="28" fill="#ffffff"/>
      <circle cx="40" cy="-6" r="18" fill="#ffffff"/>
    </g>
    <g id="sprout">
      <path d="M0,0 C0,-8 1,-14 0,-22" stroke="#2f6b2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M0,-16 C-12,-24 -18,-16 -16,-10 C-10,-8 -4,-10 0,-16 Z" fill="#5fae45"/>
      <path d="M0,-20 C10,-30 18,-24 17,-17 C11,-14 5,-15 0,-20 Z" fill="#79c75a"/>
    </g>
    <g id="tree">
      <rect x="-3" y="-6" width="6" height="18" fill="#7a5233"/>
      <circle cx="0" cy="-16" r="16" fill="#4f9440"/>
      <circle cx="-8" cy="-10" r="10" fill="#5ca64a"/>
    </g>
  </defs>

  <style>
    .drift    { animation: drift linear infinite; }
    .c1 { animation-duration: 80s;  animation-delay: -30s; }
    .c2 { animation-duration: 105s; animation-delay: -78s; }
    .c3 { animation-duration: 66s;  animation-delay: -12s; }
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }

    .rays  { animation: spin 40s linear infinite; }
    .sun   { animation: pulse 4s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

    .birds { animation: fly 38s linear infinite; animation-delay: -9s; }
    @keyframes fly { from { transform: translateX(1300px); } to { transform: translateX(-200px); } }
    .wing  { animation: flap 0.45s ease-in-out infinite alternate; }
    .wing.w2 { animation-delay: -0.2s; }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-0.35); } }

    .blades { animation: spin 7s linear infinite; }

    .tractor { animation: drive 18s linear infinite; animation-delay: -7s; }
    @keyframes drive { from { transform: translateX(-240px); } to { transform: translateX(1440px); } }
    .bob   { animation: bob 0.35s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.6px); } }
    .wheel-big   { animation: spin 2s linear infinite; }
    .wheel-small { animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .puff { animation: puff 1.8s ease-out infinite; opacity: 0; }
    .p2 { animation-delay: -0.6s; }
    .p3 { animation-delay: -1.2s; }
    @keyframes puff {
      from { transform: translate(0, 0) scale(0.4); opacity: 0.75; }
      to   { transform: translate(-34px, -38px) scale(1.7); opacity: 0; }
    }
    .dust { animation: dust 1.1s ease-out infinite; opacity: 0; }
    .d2 { animation-delay: -0.55s; }
    @keyframes dust {
      from { transform: translate(0, 0) scale(0.5); opacity: 0.6; }
      to   { transform: translate(-30px, -8px) scale(1.5); opacity: 0; }
    }

    .sway { animation: sway 2.6s ease-in-out infinite alternate; }
    .s2 { animation-delay: -0.9s; }
    .s3 { animation-delay: -1.7s; }
    @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

    .wave { animation: wave 3.2s ease-in-out infinite; }
    @keyframes wave {
      0%, 46%, 100% { transform: rotate(0deg); }
      8%, 24%       { transform: rotate(-28deg); }
      16%, 32%      { transform: rotate(6deg); }
    }

    .bar { animation: talk 0.5s ease-in-out infinite alternate; }
    .b2 { animation-delay: -0.15s; } .b3 { animation-delay: -0.32s; }
    .b4 { animation-delay: -0.08s; } .b5 { animation-delay: -0.4s; }
    @keyframes talk { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }

    .signal { animation: signal 2.4s ease-out infinite; opacity: 0; }
    .g2 { animation-delay: 0.4s; } .g3 { animation-delay: 0.8s; }
    @keyframes signal { 0% { opacity: 0; } 20% { opacity: 0.9; } 60%, 100% { opacity: 0; } }

    .say1 { animation: say1 9s infinite; }
    .say2 { animation: say2 9s infinite; opacity: 0; }
    .say3 { animation: say3 9s infinite; opacity: 0; }
    @keyframes say1 { 0%, 30% { opacity: 1; } 33.3%, 97% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes say2 { 0%, 30% { opacity: 0; } 33.3%, 63.3% { opacity: 1; } 66.6%, 100% { opacity: 0; } }
    @keyframes say3 { 0%, 63.3% { opacity: 0; } 66.6%, 96.6% { opacity: 1; } 100% { opacity: 0; } }

    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Nirmala UI', 'Noto Sans Kannada', 'Noto Sans Devanagari', sans-serif; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
    .halo  { paint-order: stroke; stroke: #ffffff; stroke-opacity: 0.55; stroke-linejoin: round; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="1200" height="420" fill="url(#sky)"/>

    <!-- sun -->
    <g transform="translate(1010,96)">
      <circle r="120" fill="url(#glow)"/>
      <g class="rays" stroke="#ffd45c" stroke-width="4" stroke-linecap="round" opacity="0.8">
        <line x1="0" y1="-62" x2="0" y2="-80"/>
        <line x1="0" y1="62" x2="0" y2="80"/>
        <line x1="-62" y1="0" x2="-80" y2="0"/>
        <line x1="62" y1="0" x2="80" y2="0"/>
        <line x1="44" y1="44" x2="57" y2="57"/>
        <line x1="-44" y1="44" x2="-57" y2="57"/>
        <line x1="44" y1="-44" x2="57" y2="-57"/>
        <line x1="-44" y1="-44" x2="-57" y2="-57"/>
      </g>
      <circle class="sun" r="46" fill="#ffcf4a"/>
      <circle r="38" fill="#ffdb6e"/>
    </g>

    <!-- clouds -->
    <g transform="translate(0,64)"><g class="drift c1"><use xlink:href="#cloud"/></g></g>
    <g transform="translate(0,118) scale(0.75)"><g class="drift c2"><use xlink:href="#cloud"/></g></g>
    <g transform="translate(0,40) scale(0.6)"><g class="drift c3"><use xlink:href="#cloud"/></g></g>

    <!-- birds -->
    <g transform="translate(0,150)">
      <g class="birds" fill="none" stroke="#3b4a3d" stroke-width="2.2" stroke-linecap="round">
        <g transform="translate(0,0)"><path class="wing" d="M-10,0 Q-5,-6 0,0 Q5,-6 10,0"/></g>
        <g transform="translate(28,-14)"><path class="wing w2" d="M-8,0 Q-4,-5 0,0 Q4,-5 8,0"/></g>
        <g transform="translate(52,6)"><path class="wing" d="M-7,0 Q-3.5,-4.5 0,0 Q3.5,-4.5 7,0"/></g>
      </g>
    </g>

    <!-- far hills -->
    <path d="M0,248 C180,206 360,236 520,214 C690,192 830,240 1000,210 C1090,196 1150,204 1200,200 L1200,420 L0,420 Z" fill="#acd293"/>

    <!-- windmill -->
    <g transform="translate(760,214)">
      <path d="M-5,0 L5,0 L3,-54 L-3,-54 Z" fill="#f4efe4" stroke="#c9bfa8" stroke-width="1"/>
      <g transform="translate(0,-56)">
        <g class="blades" fill="#ffffff" stroke="#c9bfa8" stroke-width="1">
          <path d="M0,0 L-3,-30 L3,-30 Z"/>
          <path d="M0,0 L-3,-30 L3,-30 Z" transform="rotate(120)"/>
          <path d="M0,0 L-3,-30 L3,-30 Z" transform="rotate(240)"/>
        </g>
        <circle r="3.2" fill="#8a7f69"/>
      </g>
    </g>

    <!-- mid hills and trees -->
    <path d="M0,286 C150,256 300,272 450,262 C620,250 760,284 940,262 C1060,248 1140,258 1200,254 L1200,420 L0,420 Z" fill="#8fc372"/>
    <use xlink:href="#tree" transform="translate(560,262)"/>
    <use xlink:href="#tree" transform="translate(592,266) scale(0.8)"/>
    <use xlink:href="#tree" transform="translate(1160,252) scale(0.9)"/>
    <use xlink:href="#tree" transform="translate(70,280) scale(0.7)"/>

    <!-- field -->
    <path d="M0,306 C300,296 700,302 1200,292 L1200,420 L0,420 Z" fill="url(#field)"/>
    <path d="M0,316 C320,308 720,314 1200,304 L1200,336 C720,344 320,338 0,346 Z" fill="#b98c58"/>
    <path d="M0,330 C320,323 720,329 1200,320" stroke="#a37845" stroke-width="2" fill="none" stroke-dasharray="14 10" opacity="0.6"/>
    <path d="M0,362 C400,356 800,360 1200,352" stroke="#5c9c45" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M0,386 C400,381 800,384 1200,378" stroke="#5c9c45" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M0,410 C400,406 800,408 1200,403" stroke="#5c9c45" stroke-width="5" fill="none" opacity="0.7"/>

    <!-- tractor -->
    <g transform="translate(0,262)">
      <g class="tractor">
        <!-- dust behind the rear wheel -->
        <g transform="translate(8,62)">
          <circle class="dust" r="7" fill="#c9a476"/>
          <circle class="dust d2" r="6" fill="#c9a476"/>
        </g>
        <!-- exhaust -->
        <g transform="translate(123,-20)">
          <circle class="puff" r="6" fill="#b9b9b9"/>
          <circle class="puff p2" r="6" fill="#c8c8c8"/>
          <circle class="puff p3" r="6" fill="#d4d4d4"/>
        </g>
        <g class="bob">
          <rect x="120" y="-18" width="6" height="32" rx="2" fill="#3d3d3d"/>
          <!-- hood -->
          <rect x="62" y="10" width="98" height="30" rx="5" fill="#d9442b"/>
          <rect x="152" y="14" width="8" height="22" rx="2" fill="#8f2a19"/>
          <rect x="70" y="16" width="70" height="4" rx="2" fill="#f07a5f" opacity="0.7"/>
          <!-- cabin -->
          <rect x="26" y="-36" width="48" height="56" rx="4" fill="#d9442b"/>
          <rect x="34" y="-29" width="32" height="24" rx="3" fill="#cfe9f5"/>
          <circle cx="50" cy="-16" r="7" fill="#9a6440"/>
          <path d="M43,-20 C44,-28 56,-28 57,-20 C53,-23 47,-23 43,-20 Z" fill="#e5702a"/>
          <rect x="18" y="-44" width="64" height="9" rx="3" fill="#a8301c"/>
          <!-- fender -->
          <path d="M2,34 A38,38 0 0 1 78,34 L70,34 A30,30 0 0 0 10,34 Z" fill="#a8301c"/>
        </g>
        <!-- rear wheel -->
        <g transform="translate(40,34)">
          <g class="wheel-big">
            <circle r="30" fill="#2a2a2a"/>
            <circle r="30" fill="none" stroke="#444" stroke-width="5" stroke-dasharray="6 6"/>
            <circle r="15" fill="#f2c14e"/>
            <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="#c9952a" stroke-width="3"/>
            <circle r="5" fill="#5a5a5a"/>
          </g>
        </g>
        <!-- front wheel -->
        <g transform="translate(138,46)">
          <g class="wheel-small">
            <circle r="18" fill="#2a2a2a"/>
            <circle r="18" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="5 5"/>
            <circle r="9" fill="#f2c14e"/>
            <path d="M-9,0 L9,0 M0,-9 L0,9" stroke="#c9952a" stroke-width="2.4"/>
            <circle r="3" fill="#5a5a5a"/>
          </g>
        </g>
      </g>
    </g>

    <!-- foreground sprouts -->
    <g>
      <g transform="translate(40,402)"><g class="sway"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(100,396)"><g class="sway s2"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(160,404)"><g class="sway s3"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(220,398)"><g class="sway"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(280,404)"><g class="sway s2"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(340,397)"><g class="sway s3"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(400,403)"><g class="sway"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(460,397)"><g class="sway s2"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(520,404)"><g class="sway s3"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(580,398)"><g class="sway"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(640,404)"><g class="sway s2"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(700,398)"><g class="sway s3"><use xlink:href="#sprout"/></g></g>
      <g transform="translate(760,404)"><g class="sway"><use xlink:href="#sprout"/></g></g>
    </g>

    <!-- soil sensor node, sending readings to the kiosk -->
    <g transform="translate(850,396)">
      <rect x="-3" y="-4" width="6" height="16" fill="#8a8f96"/>
      <rect x="-14" y="-30" width="28" height="26" rx="4" fill="#1f6f78"/>
      <rect x="-9" y="-25" width="18" height="8" rx="2" fill="#9fe0c9"/>
      <circle cx="0" cy="-10" r="2.4" fill="#ffd45c"/>
      <g fill="none" stroke="#1f6f78" stroke-width="2.4" stroke-linecap="round">
        <path class="signal" d="M-8,-38 A10,10 0 0 1 8,-38"/>
        <path class="signal g2" d="M-14,-44 A17,17 0 0 1 14,-44"/>
        <path class="signal g3" d="M-20,-50 A24,24 0 0 1 20,-50"/>
      </g>
    </g>

    <!-- voice kiosk -->
    <g transform="translate(1110,410)">
      <rect x="-5" y="-96" width="10" height="96" fill="#5b5f55"/>
      <rect x="-22" y="-4" width="44" height="8" rx="3" fill="#4a4e45"/>
      <rect x="-40" y="-150" width="80" height="60" rx="8" fill="#22302a"/>
      <rect x="-33" y="-143" width="66" height="38" rx="4" fill="#e3f4dc"/>
      <g transform="translate(0,-112)" fill="#3f8f3a">
        <rect class="bar"    x="-23" y="-22" width="6" height="22" rx="2"/>
        <rect class="bar b2" x="-13" y="-22" width="6" height="22" rx="2"/>
        <rect class="bar b3" x="-3"  y="-22" width="6" height="22" rx="2"/>
        <rect class="bar b4" x="7"   y="-22" width="6" height="22" rx="2"/>
        <rect class="bar b5" x="17"  y="-22" width="6" height="22" rx="2"/>
      </g>
      <circle cx="-28" cy="-97" r="2.2" fill="#ff6b4a"/>
      <circle cx="28" cy="-97" r="2.2" fill="#9aa39a"/>
    </g>

    <!-- farmer -->
    <g transform="translate(1010,404)">
      <ellipse cx="0" cy="2" rx="26" ry="5" fill="#2f5e24" opacity="0.35"/>
      <!-- dhoti and feet -->
      <path d="M-17,-52 L17,-52 L21,-4 L-21,-4 Z" fill="#f6f2e7"/>
      <path d="M0,-50 L0,-6" stroke="#ddd6c4" stroke-width="2"/>
      <ellipse cx="-10" cy="-2" rx="8" ry="4" fill="#7a4a2c"/>
      <ellipse cx="10" cy="-2" rx="8" ry="4" fill="#7a4a2c"/>
      <!-- left arm, resting -->
      <path d="M-18,-94 L-24,-58" stroke="#4c8fc9" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-25" cy="-54" r="5" fill="#9a6440"/>
      <!-- kurta -->
      <path d="M-20,-100 Q0,-108 20,-100 L22,-48 L-22,-48 Z" fill="#4c8fc9"/>
      <path d="M-18,-100 L16,-56" stroke="#3c9a4c" stroke-width="7" stroke-linecap="round"/>
      <!-- right arm, waving -->
      <g transform="translate(18,-96) rotate(38)">
        <g class="wave">
          <path d="M0,0 L0,-24" stroke="#4c8fc9" stroke-width="10" stroke-linecap="round"/>
          <path d="M0,-24 L0,-36" stroke="#9a6440" stroke-width="8" stroke-linecap="round"/>
          <circle cx="0" cy="-40" r="6" fill="#9a6440"/>
        </g>
      </g>
      <!-- head -->
      <rect x="-4" y="-108" width="8" height="8" fill="#8a5838"/>
      <circle cx="0" cy="-120" r="14" fill="#9a6440"/>
      <circle cx="-5" cy="-122" r="1.6" fill="#2a1a10"/>
      <circle cx="5" cy="-122" r="1.6" fill="#2a1a10"/>
      <path d="M-7,-114 Q-3.5,-116 0,-114 Q3.5,-116 7,-114" stroke="#2a1a10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M-3.5,-109 Q0,-107 3.5,-109" stroke="#5a2f1c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- turban -->
      <path d="M-15,-124 C-16,-142 16,-142 15,-124 C8,-130 -8,-130 -15,-124 Z" fill="#e5702a"/>
      <path d="M-13,-130 C-4,-138 6,-138 14,-128" stroke="#c95a1c" stroke-width="2" fill="none"/>
    </g>

    <!-- speech bubble: the same question in English, Kannada and Hindi -->
    <g transform="translate(790,196)">
      <path d="M0,0 H228 A12,12 0 0 1 240,12 V40 A12,12 0 0 1 228,52 H214 L212,66 L188,52 H12 A12,12 0 0 1 0,40 V12 A12,12 0 0 1 12,0 Z" fill="#ffffff" stroke="#cfd8c6" stroke-width="1.4"/>
      <text class="say1" x="120" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1f3d25">When should I water?</text>
      <text class="say2" x="120" y="33" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3d25">ನೀರು ಯಾವಾಗ ಹಾಕಬೇಕು?</text>
      <text class="say3" x="120" y="33" text-anchor="middle" font-size="17" font-weight="600" fill="#1f3d25">पानी कब देना चाहिए?</text>
    </g>

    <!-- title -->
    <text x="62" y="84" font-size="16" font-weight="700" letter-spacing="3" fill="#3f6f36" class="halo" stroke-width="4">ಚಿಗುರು  ·  A NEW SPROUT</text>
    <text x="58" y="146" font-size="56" fill="#1f3d25" class="title halo" stroke-width="7">Chiguru · Smart Krishi</text>
    <text x="62" y="184" font-size="20" fill="#34503a" class="halo" stroke-width="5">A voice-first farm assistant that speaks the farmer's language</text>
  </g>
</svg>
